<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>can you text me back</title>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: #ffffff;
      color: #000;
      font-family: system-ui, sans-serif;
    }
    #chat {
      box-sizing: border-box;
      width: 300px;
      max-width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    span {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 16px;
    }
    .left span {
      background: #ebebeb;
    }
    .right span {
      background: #2194ff;
      color: #fff;
    }
    .right {
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div class="left"><span>i love you too</span></div>
    <div class="right"><span>...</span></div>
  </div>
</body>
</html>
